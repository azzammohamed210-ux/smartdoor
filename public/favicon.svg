<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e75e6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#boxGrad)"/>

  <!-- Glowing border box -->
  <rect x="56" y="156" width="400" height="200" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="4" filter="url(#glow)" opacity="0.9"/>
  <rect x="56" y="156" width="400" height="200" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Lightning bolt -->
  <g transform="translate(96,196)" filter="url(#glowStrong)">
    <path d="M28 0 L8 36 L22 36 L14 68 L44 28 L28 28 Z" fill="#fbbf24" stroke="#fde68a" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(96,196)">
    <path d="M28 0 L8 36 L22 36 L14 68 L44 28 L28 28 Z" fill="#fbbf24" stroke="#fde68a" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- SMARTDOOR text -->
  <g filter="url(#glow)">
    <text x="288" y="280" font-size="52" font-weight="700" letter-spacing="4"
          text-anchor="middle" fill="url(#textGrad)"
          font-family="'Courier New', Courier, monospace">SMARTDOOR</text>
  </g>
  <text x="288" y="280" font-size="52" font-weight="700" letter-spacing="4"
        text-anchor="middle" fill="url(#textGrad)"
        font-family="'Courier New', Courier, monospace">SMARTDOOR</text>
</svg>
